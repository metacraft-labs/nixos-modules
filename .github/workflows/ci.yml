name: CI

on:
  # Allow this workflow to be triggered manually:
  workflow_dispatch:

  # Allow this workflow to be run in merge queues:
  merge_group:

  # Run this workflow when PRs target the active integration branches:
  pull_request:
    branches:
      - dev
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: ./.github/workflows/reusable-lint.yml
    secrets: inherit

  test-mcl:
    strategy:
      fail-fast: false
      # Test setup-nix's support for specifying which Nix version to install
      # on github-hosted runners
      matrix:
        include:
          - runner: eph-linux-x64-g2
            nix-version: ''
          - runner: eph-linux-x64-g2
            nix-version: 2.28.5
          - runner: eph-linux-x64-g2
            nix-version: 2.33.0
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout first to use locally defined actions
        uses: actions/checkout@v6.0.2

      - name: Setup Nix
        uses: ./.github/setup-nix
        with:
          nix-version: ${{ matrix.nix-version }}
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: default

      - name: Build and test the `mcl` command
        run: dub test --root packages/mcl -- -e 'fetchJson|(coda\.)|nix.run|nix.build'

  # Regression test for the setup-nix action: a devShell that fails to build
  # must make the action fail (not silently report success and surface later as
  # an obscure "command not found"), while a working devShell must still be
  # exported to $GITHUB_ENV. Uses the fixture flake under
  # `.github/setup-nix/tests/devshell-fixture/`.
  test-setup-nix-devshell:
    name: Validate setup-nix devShell build-failure detection
    runs-on: eph-linux-x64-g2
    steps:
      - name: Checkout first to use locally defined actions
        uses: actions/checkout@v6.0.2

      - name: Stage the devShell test fixture as the workspace flake
        run: |
          cp .github/setup-nix/tests/devshell-fixture/flake.nix ./flake.nix
          rm -f flake.lock

      - name: Setup Nix with a failing devShell (expected to fail)
        id: setup-failing
        continue-on-error: true
        uses: ./.github/setup-nix
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: failing

      - name: Assert the failing devShell was detected
        run: |
          if [ "${{ steps.setup-failing.outcome }}" != "failure" ]; then
            echo "::error::Setup Nix reported '${{ steps.setup-failing.outcome }}' for a devShell that fails to build; expected 'failure'."
            exit 1
          fi
          echo "OK: Setup Nix correctly failed when the devShell could not be built."

      - name: Setup Nix with a working devShell (expected to succeed)
        id: setup-working
        uses: ./.github/setup-nix
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: default

      - name: Assert the working devShell was exported to PATH
        run: |
          if ! command -v hello >/dev/null; then
            echo "::error::'hello' from the devShell is not on PATH; the environment was not exported to GITHUB_ENV."
            exit 1
          fi
          echo "OK: devShell environment exported; hello resolved to $(command -v hello)."

  # Regression test for the OTHER way a Nix setup step lies: reporting success
  # while `experimental-features` never took effect. `cachix/install-nix-action`
  # does this on every `eph-*` image — it finds the pre-installed Nix, prints
  # "Aborting: Nix is already installed", exits 0, and silently discards
  # `extra_nix_config`, so the job dies later in an unrelated step with
  # "nix-command is disabled".
  #
  # The Linux case is deliberately retained because that runner IS the
  # pre-installed-Nix case where the upstream action no-ops. Native Darwin is
  # equally deliberate: it exercises macOS's symlinked /var temp root and the
  # service PATH that originally omitted system utilities. If our guard were
  # wrong in either direction — too strict, or not checking at all — one of
  # these real platform contracts says so.
  test-setup-nix-verification:
    name: Validate setup-nix verification (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: eph-linux-x64
          - system: aarch64-darwin
            runner: eph-macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout first to use locally defined actions
        uses: actions/checkout@v6.0.2

      # On this runner Nix already exists, so the installer step is skipped and
      # only `Configure Nix` + the new verification run. A green step here is
      # positive evidence that the features are live on a pre-installed Nix.
      - name: Setup Nix on a runner that already has Nix
        uses: ./.github/setup-nix
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Confirm the requested features are usable without extra flags
        shell: bash
        run: |
          set -euo pipefail
          # No --extra-experimental-features anywhere: if configuration alone
          # did not enable these, this fails exactly as a real job step would.
          nix eval --raw --expr '"nix-command-ok"'
          echo
          nix config show experimental-features

      - name: Run the verification contract test
        shell: bash
        run: bash .github/setup-nix/tests/verify-nix-config-test.sh

  test-mcl-secret-integration:
    runs-on: eph-linux-x64-g2
    steps:
      - name: Checkout first to use locally defined actions
        uses: actions/checkout@v6.0.2

      - name: Setup Nix
        uses: ./.github/setup-nix
        with:
          push-to-cache: false
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}

      - name: Run mcl secret integration tests
        run: nix run .#checks.x86_64-linux.secret-integration

  ci:
    uses: ./.github/workflows/reusable-flake-checks-ci-matrix.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      # Foundry takes longer than vm-harness's currently deployed 600-second
      # default. Remove this override after this PR's provider fix is deployed.
      foundry-darwin-bootstrap-runner: '["aarch64-darwin"]'
      # Route this repo's flake-check matrix at the GPU hosts' ephemeral scale
      # set `eph-linux-x64-g1` (gpu-server-001) instead of the saturated
      # `eph-linux-x64` class on high-mem-server. Only this CALLER is
      # re-pointed; the reusable workflow's own defaults stay on
      # `eph-linux-x64` (checks/deployment-production-cutover.nix asserts
      # those literals), and `results-runner` is deliberately left alone
      # because `ci / Final Results` is a required status check.
      non-nix-runner: '["eph-linux-x64-g1"]'
      runners: |
        {
          "x86_64-linux": [
            "eph-linux-x64-g1"
          ],
          "aarch64-darwin": [
            "eph-macos-arm64"
          ]
        }

  # The `just act lint` step builds `ci-image` and runs the lint workflow inside
  # it via `act`, i.e. it needs nested Docker. Every `eph-linux-x64` container
  # now provides it: the runner-image consolidation folded the retired
  # `vmharness-nested` provider's capability into the single `vmharness` provider
  # and `vmh-linux-runner` image (nested Docker + nested KVM), so the separate
  # `eph-linux-x64-nested` class is a transitional alias for the same container
  # and carries no extra capability.
  test-act:
    runs-on: eph-linux-x64
    steps:
      - name: Checkout first to use locally defined actions
        uses: actions/checkout@v6.0.2

      - name: Setup Nix
        uses: ./.github/setup-nix
        with:
          push-to-cache: true
          trusted-public-keys: ${{ vars.TRUSTED_PUBLIC_KEYS }}
          substituters: ${{ vars.SUBSTITUTERS }}
          devshell: default

      - name: Create `.gh-vars.env` and `.gh-secrets.env` files
        run: |
          {
            echo 'ATTIC_ENDPOINT=${{ vars.ATTIC_ENDPOINT }}'
            echo 'ATTIC_CACHE=${{ vars.ATTIC_CACHE }}'
            echo 'ATTIC_SUBSTITUTER=${{ vars.ATTIC_SUBSTITUTER }}'
            echo 'ATTIC_TRUSTED_PUBLIC_KEY=${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}'
            echo 'SUBSTITUTERS=${{ vars.SUBSTITUTERS }}'
            echo 'TRUSTED_PUBLIC_KEYS=${{ vars.TRUSTED_PUBLIC_KEYS }}'
          } > .gh-vars.env

          {
            echo 'ATTIC_TOKEN=${{ secrets.ATTIC_TOKEN }}'
          } > .gh-secrets.env

      - name: Build `ci-image` and run the `lint` workflow inside it with `act`
        run: just act lint
